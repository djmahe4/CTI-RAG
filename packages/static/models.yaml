MODEL_NAMES:
  openai:
    name: OpenAI
    url: https://platform.openai.com/docs/models
    default: gpt-4o-mini
    base_url: "https://jeniya.top/v1"
    env:
      - OPENAI_API_KEY
    models:
      - gpt-4o-mini
      - gemini-3-flash-preview
      - gpt-5-mini
  deepseek:
    name: DeepSeek
    url: https://platform.deepseek.com/api-docs/zh-cn/pricing
    default: deepseek-chat
    base_url: https://api.deepseek.com/v1
    env:
      - DEEPSEEK_API_KEY
    models:
      - deepseek-chat
      - deepseek-reasoner
