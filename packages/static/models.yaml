EMBED_MODEL_INFO:
  dashscope/text-embedding-v4:
    name: text-embedding-v4
    dimension: 1024
    url: DASHSCOPE_BASE_URL
    api_key: DASHSCOPE_API_KEY
  local/BAAI/bge-m3:
    name: BAAI/bge-m3
    dimension: 1024
    local_path: /app/models/embedding_model/bge-m3 # Can also be configured here

RERANKER_LIST:

  local/BAAI/bge-m3:
    name: BAAI/bge-m3
    local_path: /app/models/embedding_model/bge-m3 # Can also be configured here

  zhipu/rerank:
    name: rerank
    url: https://open.bigmodel.cn/api/paas/v4/rerank
    description: Zhipu AI text reranking model, supports up to 128 documents, max 4096 characters per document.

