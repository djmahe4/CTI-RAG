[pytest]
# Test file matching patterns
python_files = *_test.py
python_classes = Test*
python_functions = test_*

# Display detailed test output
addopts = -v

# Async test support
asyncio_mode = auto

# Log level settings
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S 