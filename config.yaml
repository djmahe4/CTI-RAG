# ThreatRAG 统一配置文件

# 功能开关
enable_reranker: true
enable_knowledge_base: true
enable_knowledge_graph: true
enable_web_search: true
enable_hybrid_retrieval: true

# 查询配置
use_rewrite_query: "on"  # 是否使用重写查询

# 模型配置
model_provider: "ollama"
model_name: "qwen3:30b"

embed_model: "dashscope/text-embedding-v4"

reranker: "zhipu/rerank"


# 设备配置
# 如宿主机或容器内未能正确挂载 GPU，可先改为 cpu，避免 CUDA 设备不可用错误
device: "cpu"

# FastAPI服务器配置
fastapi_server:
  host: 0.0.0.0  # 修改为0.0.0.0以允许外部访问
  port: 8000

# 向量数据库配置
vector_database:
  path: /app/data/vector_db

# 文件上传配置
file_upload:
  path: /app/data/file_uploads

# 模型路径配置
model:
  embedding_model:
    path: /app/data/embedding_model

# Milvus配置
milvus:
  auto_start: false
  data_dir: ./milvus_lite
  host: milvus-standalone
  port: 19530

# Neo4j配置
neo4j:
  auto_start: false
  data_dir: ./neo4j_data
  host: neo4j
  port: 7688
  http_port: 7474
  # 添加索引器配置
  index_interval: 600  # 索引间隔，单位为秒，默认1小时
  index_batch_size: 200  # 每次处理的实体数量
  auto_index: true  # 是否自动启动索引器

rl_base_model_path: /app/models/reasoning_model/Qwen2.5-3B-Instruct
rl_lora_path: /app/models/reasoning_model/final_lora
rl_policy_checkpoint_path: /app/models/reasoning_model/rl_policy_path_match/best_policy.pt
rl_device: cpu        # RL 接口暂时关闭，保持 CPU 安全态
